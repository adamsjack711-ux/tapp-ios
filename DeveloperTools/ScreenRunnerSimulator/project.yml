name: ScreenRunnerSimulator
options:
  bundleIdPrefix: com.pocketagent.testing
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  PocketAgentCore:
    type: framework
    platform: iOS
    sources:
      - path: ../../Sources/PocketAgentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketagent.testing.core
        GENERATE_INFOPLIST_FILE: YES
  ScreenRunnerTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../iCTRL/iCTRLUITests
      - path: ../iCTRL/iCTRLKit
      - path: ScreenInteractionUITests.swift
    dependencies:
      - target: PocketAgentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketagent.testing.screenrunner
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: ../iCTRL/iCTRLUITests/XCTestPrivate-Bridging-Header.h
        TEST_HOST: ""
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Local simulator screen-control testing."
schemes:
  ScreenRunnerSimulator:
    build:
      targets:
        ScreenRunnerTests: [test]
    test:
      targets:
        - name: ScreenRunnerTests
          selectedTests:
            - ScreenInteractionUITests
      preferredScreenCaptureFormat: screenshots
      captureScreenshotsAutomatically: false
