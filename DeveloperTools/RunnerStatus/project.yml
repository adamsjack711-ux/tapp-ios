include:
  - ../iCTRL/project.yml
name: PocketRunner
targets:
  iCTRL:
    settings:
      base:
        INFOPLIST_FILE: ../iCTRL/iCTRLApp/Info.plist
  iCTRLUITests:
    deploymentTarget: "17.0"
    sources:
      - RunnerLiveActivity.swift
      - RunnerStatusBootstrap.m
      - ../../Shared/AutomationActivityAttributes.swift
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: ../iCTRL/iCTRLUITests/XCTestPrivate-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) POCKET_RUNNER_STATUS"
    dependencies:
      - target: PocketAgentActivity
        embed: false
        link: false
  PocketAgentActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ../../PocketAgentActivity
      - ../../Shared/AutomationActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ICTRL_BUNDLE_PREFIX).ictrl.uitests.xctrunner.activity"
        INFOPLIST_FILE: ../../PocketAgentActivity/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
