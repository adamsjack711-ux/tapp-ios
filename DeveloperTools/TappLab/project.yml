name: TappLab
options:
  bundleIdPrefix: com.hitapp.research
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    SUPPORTED_PLATFORMS: iphonesimulator
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  TappClickTarget:
    type: application
    platform: iOS
    sources:
      - path: ClickTarget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackadamslovell.TappClickTarget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tapp Click Test
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 92X682GNVP
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
  TappDeviceProbe:
    type: application
    platform: iOS
    sources:
      - path: DeviceProbe
      - path: SharedRenderer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackadamslovell.TappDeviceProbe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tapp Research
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 92X682GNVP
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
  TappOverlayProbe:
    type: application
    platform: iOS
    sources:
      - path: OverlayProbe
      - path: SharedRenderer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitapp.research.TappOverlayProbe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tapp Overlay Probe
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
  TappLab:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/TappMotion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitapp.research.TappLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tapp Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  TappClickTarget:
    build:
      targets:
        TappClickTarget: all
  TappDeviceProbe:
    build:
      targets:
        TappDeviceProbe: all
  TappOverlayProbe:
    build:
      targets:
        TappOverlayProbe: all
  TappLab:
    build:
      targets:
        TappLab: all
