<div id="hitapp-performative" class="viz-dotted-background" aria-label="hitapp Aura design">
 <section data-variant="Aura" aria-label="Aura home design">
  <div class="hp-stage"><div class="hp-phone hp-aura" data-design="Aura" aria-label="Aura appearance">
   <div class="hp-aurora"></div>
   <div class="hp-status"><span>9:41</span><div class="hp-island"></div><div class="hp-device"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></div></div>
   <header class="hp-header"><div class="hp-brand"><span class="hp-brand-dot"></span>hitapp</div><button class="hp-icon cursor-interaction" data-action="history" aria-label="Recent conversations"><i data-lucide="history" aria-hidden="true"></i></button></header>
   <main><div class="hp-hero"><div class="hp-kicker">A little less to do</div><h1>What's on<br>your mind, Jack?</h1><p class="hp-muted">A thought, a task, a tiny favour.</p></div>
   <div class="hp-presence hp-glass"><div class="hp-pal" aria-hidden="true"><b></b><b></b><span class="hp-mouth"></span></div><div><div class="hp-state">Right here with you.</div><div class="hp-muted"><span class="hp-online"></span>Connected to your Mac</div></div></div>
   <div class="hp-caption"><span>A place to start</span><span>↗</span></div>
   <button class="hp-suggestion cursor-interaction" data-action="reminder"><i data-lucide="bell" aria-hidden="true"></i><span>Remember something for me</span><i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
   <button class="hp-suggestion cursor-interaction" data-action="screenshot"><i data-lucide="scan-line" aria-hidden="true"></i><span>Help with what's on my screen</span><i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
   </main><div class="hp-footer" data-composer></div><div class="hp-homebar"></div>
  </div></div>
 </section>
</div>
<script>
(() => {
 const root=document.getElementById('hitapp-performative');
 const phones=[...root.querySelectorAll('.hp-phone')];
 const memories={};
 const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const pal='<div class="hp-pal" aria-hidden="true"><b></b><b></b><span class="hp-mouth"></span></div>';
 const icons=()=>{root.querySelectorAll('.hp-pal').forEach(pal=>{if(pal.querySelector('.hp-bubble'))return;const bubble=document.createElement('span');bubble.className='hp-bubble';bubble.setAttribute('aria-hidden','true');bubble.innerHTML='<span></span><span></span><span></span>';pal.append(bubble);pal.removeAttribute('aria-hidden');const trigger=document.createElement('button');trigger.type='button';trigger.className='hp-pal-trigger cursor-interaction';trigger.setAttribute('aria-label','Animate cursor bubble');trigger.addEventListener('click',()=>{pal.classList.remove('hp-bubbling');void pal.offsetWidth;pal.classList.add('hp-bubbling');clearTimeout(pal.bubbleTimer);pal.bubbleTimer=setTimeout(()=>pal.classList.remove('hp-bubbling'),2600);});pal.append(trigger);});if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}})};
 const save=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{designDrafts:memories},privateContent:null}).catch(()=>{});};
 phones.forEach(phone=>{
  const name=phone.dataset.design;let timer,toastTimer,mode='guide',lastFocus;
  phone.querySelector('[data-composer]').innerHTML=`<div class="hp-composer"><div class="hp-attachment" hidden>${icon('image')}<span>Sample screenshot attached</span><button class="cursor-interaction" data-action="remove" aria-label="Remove sample screenshot">${icon('x')}</button></div><textarea aria-label="Message hitapp" placeholder="Ask anything, or just talk…" rows="2"></textarea><div class="hp-composer-bottom"><button class="hp-icon cursor-interaction" data-action="screenshot" aria-label="Attach sample screenshot">${icon('plus')}</button><span class="hp-composer-hint">${name==='Relay'?'Your next move':'Text, voice, or a screenshot'}</span><button class="hp-icon cursor-interaction" data-action="mic" aria-label="Preview voice input">${icon('mic')}</button><button class="hp-icon hp-send cursor-interaction" data-action="send" aria-label="Send message">${icon('arrow-up')}</button></div></div><div class="hp-connection"><span class="hp-online"></span>${name==='Orbit'?'Here when you need a hand':'Private connection · Your Mac'}</div><div class="hp-toast" role="status" hidden></div>`;
  const overlay=document.createElement('div');overlay.className='hp-overlay';overlay.hidden=true;overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','Action preview');phone.append(overlay);
  const draft=phone.querySelector('textarea');
  const toast=(msg)=>{clearTimeout(toastTimer);const el=phone.querySelector('.hp-toast');el.textContent=msg;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,3500);};
  const state=(s,label='')=>{phone.dataset.state=s;const island=phone.querySelector('.hp-island');island.classList.toggle('active',!!label);island.replaceChildren();if(label){const eye=document.createElement('span');eye.className='hp-eye';island.append(eye,document.createTextNode(label));}};
  const close=()=>{clearTimeout(timer);overlay.hidden=true;state('idle');[...phone.children].filter(x=>x!==overlay).forEach(x=>x.inert=false);lastFocus?.focus();};
  const show=(body,label='Action preview')=>{if(overlay.hidden)lastFocus=document.activeElement;overlay.setAttribute('aria-label',label);overlay.innerHTML=`<div class="hp-sheet-top"><span class="hp-kicker">hitapp · ${label}</span><button class="hp-icon cursor-interaction" data-action="close" aria-label="Close preview">${icon('x')}</button></div>${body}`;overlay.hidden=false;[...phone.children].filter(x=>x!==overlay).forEach(x=>x.inert=true);icons();overlay.querySelector('button')?.focus();};
  const review=()=>{state('idle','Ready for review');show(`${pal}<div class="hp-sheet-title">Look good?</div><p class="hp-sheet-subtitle">One small thing, ready to leave your mind.</p><div class="hp-review hp-glass"><div class="hp-review-label">Create reminder</div><div class="hp-review-name">Call Mum</div><div class="hp-review-line"><span>When</span><span>Today, 6:00 pm</span></div><div class="hp-review-line"><span>Add to</span><span>Reminders · Personal</span></div></div><button class="hp-primary cursor-interaction" data-action="approve">${icon('check')}Add reminder</button><button class="hp-secondary cursor-interaction" data-action="edit">Edit request</button>`,'Review');};
  const done=()=>{state('done','Done');show(`${pal}<div class="hp-sheet-title">One less thing.</div><p class="hp-sheet-subtitle">Your reminder is ready in this preview.</p><div class="hp-review hp-glass"><div class="hp-review-label">Reminder preview</div><div class="hp-review-name" style="margin-bottom:7px">Call Mum</div><p class="hp-muted">Today at 6:00 pm · Personal</p></div><button class="hp-primary cursor-interaction" data-action="close">Lovely. What's next?</button>`,'Done');memories[name]={lastAction:'Previewed reminder completion'};save();};
  const working=(finish,verb)=>{state('working',verb);show(`${pal}<div class="hp-sheet-title"><span class="hp-glyph">✳</span> ${verb}</div><p class="hp-sheet-subtitle" role="status">${verb==='Getting it ready'?'Turning your request into an action to review.':'Adding your reminder in this preview.'}</p><div style="height:150px"></div><button class="hp-secondary cursor-interaction" data-action="close">Cancel</button>`,'Working');timer=setTimeout(finish,1800);};
  const send=()=>{const value=draft.value.trim();if(!value){toast('Type a message, or try the microphone.');draft.focus();return;}memories[name]={draft:value};save();if(/mum|remind|remember|call/i.test(value)){working(review,'Getting it ready');}else{state('done','Draft received');show(`${pal}<div class="hp-sheet-title">Got your thought.</div><p class="hp-sheet-subtitle">This design preview keeps your message here.</p><div class="hp-draft"></div><button class="hp-primary cursor-interaction" data-action="reminder">Try a reminder</button><button class="hp-secondary cursor-interaction" data-action="close">Back to conversation</button>`,'Conversation');overlay.querySelector('.hp-draft').textContent=value;}};
  phone.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
   if(action==='close'){close();return;}
   if(action==='reminder'){draft.value='Remind me to call Mum today at 6 pm';working(review,'Getting it ready');return;}
   if(action==='review'){review();return;}
   if(action==='approve'){working(done,'Adding reminder');return;}
   if(action==='edit'){close();draft.value='Remind me to call Mum today at 6 pm';draft.focus();return;}
   if(action==='send'){send();return;}
   if(action==='screenshot'){phone.querySelector('.hp-attachment').hidden=false;draft.placeholder='What would you like to do with this?';toast('Sample context attached. Add your question below.');draft.focus();return;}
   if(action==='remove'){phone.querySelector('.hp-attachment').hidden=true;draft.placeholder='Ask anything, or just talk…';return;}
   if(action==='mic'){state('listening','Listening');show(`${pal}<div class="hp-sheet-title">I'm listening.</div><p class="hp-sheet-subtitle">Sample voice draft</p><div class="hp-wave" aria-hidden="true">${Array.from({length:17},(_,i)=>`<span style="--i:${i%7}"></span>`).join('')}</div><div class="hp-draft">Remind me to call Mum today at six.</div><button class="hp-primary cursor-interaction" data-action="voice-done">Review voice draft</button><button class="hp-secondary cursor-interaction" data-action="close">Cancel</button>`,'Voice');timer=setTimeout(()=>{state('idle','Draft ready');overlay.querySelector('.hp-sheet-title').textContent='Ready when you are.';overlay.querySelector('.hp-sheet-subtitle').textContent='Review your words before sending.';},3500);return;}
   if(action==='voice-done'){close();draft.value='Remind me to call Mum today at 6 pm';draft.focus();toast('Voice draft ready. You choose when to send.');return;}
   if(action==='act'||action==='guide'){mode=action;phone.querySelectorAll('.hp-mode button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.action===mode)));phone.querySelector('.hp-mode-description').textContent=mode==='act'?'Review each proposed action before it runs.':'Get steps you can follow on your phone.';memories[name]={mode};save();return;}
   if(action==='new'){draft.value='';toast('A fresh conversation. What’s on your mind?');draft.focus();return;}
   if(action==='history'){show(`<div class="hp-sheet-title" style="text-align:left">Recent conversations</div><button class="hp-thread-action cursor-interaction" data-action="reminder">${icon('bell')}Remember the little things${icon('arrow-right')}</button><p class="hp-muted" style="margin:0 4px 140px">Today · Reminder conversation</p><button class="hp-secondary cursor-interaction" data-action="close">Back</button>`,'Conversations');return;}
   if(action==='connection'){show(`${pal}<div class="hp-sheet-title">Your Mac is here.</div><p class="hp-sheet-subtitle">A quiet connection to your assistant.</p><div class="hp-review hp-glass"><div class="hp-review-line" style="border:0;margin:0;padding:0"><span>Connection</span><span>Mac · Available</span></div><div class="hp-review-line"><span>Session</span><span>Preview</span></div></div><button class="hp-primary cursor-interaction" data-action="close">Done</button>`,'Connection');}
  });
  draft.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  overlay.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
  draft.addEventListener('change',()=>{memories[name]={...memories[name],draft:draft.value};save();});
  const appearance={glow:68,corners:26,reducedMotion:false};
  if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{phone.style.setProperty('--hp-glow',appearance.glow/100);phone.style.setProperty('--hp-radius',appearance.corners+'px');phone.classList.toggle('hp-reduce',appearance.reducedMotion);}});tweak.addSlider(appearance,'glow',{label:'Aurora glow',min:0,max:100,unit:'%'});tweak.addSlider(appearance,'corners',{label:'Glass corners',min:12,max:32,unit:'px'});tweak.addToggle(appearance,'reducedMotion',{label:'Reduced motion'});}
 });
 const restore=s=>{const data=s?.modelContent?.designDrafts;if(!data)return;phones.forEach(p=>{const saved=data[p.dataset.design];if(saved?.draft)p.querySelector('textarea').value=saved.draft;memories[p.dataset.design]=saved||{};});};
 restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
 icons();
})();
</script>
